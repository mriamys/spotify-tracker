services:
  spotify-tracker:
    build: .
    container_name: spotify-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Kyiv
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          memory: 15M
    networks:
      - bots-net

networks:
  bots-net:
    external: true
